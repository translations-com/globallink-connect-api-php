name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.3', '8.4']

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run static analysis
        run: composer analyse

      - name: Run unit tests
        run: composer test:unit

      - name: Run integration tests
        if: ${{ secrets.GLE_TEST_API_URL != '' }}
        env:
          GLE_TEST_API_URL: ${{ secrets.GLE_TEST_API_URL }}
          GLE_TEST_USERNAME: ${{ secrets.GLE_TEST_USERNAME }}
          GLE_TEST_PASSWORD: ${{ secrets.GLE_TEST_PASSWORD }}
          GLE_TEST_OAUTH_CLIENT: ${{ secrets.GLE_TEST_OAUTH_CLIENT }}
          GLE_TEST_OAUTH_SECRET: ${{ secrets.GLE_TEST_OAUTH_SECRET }}
          GLE_TEST_PROJECT_ID: ${{ secrets.GLE_TEST_PROJECT_ID }}
        run: composer test:integration

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check syntax errors
        run: find src tests -name "*.php" -exec php -l {} \;

      - name: Run static analysis
        run: composer analyse
